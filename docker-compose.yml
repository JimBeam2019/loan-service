services:
  postgres:
    image: postgres:17-alpine
    container_name: loan-engine-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: loan-engine
      POSTGRES_USER: loan-engine
      POSTGRES_PASSWORD: password
    networks:
      loan-network:
        ipv4_address: 172.20.0.2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loan-engine -d loan-engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  loan-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: loan-engine
    restart: unless-stopped
    environment:
      USE_POSTGRES: true
      POSTGRES_SERVER_HOST: postgres
      POSTGRES_SERVER_PORT: 5432
      POSTGRES_DB: loan-engine
      POSTGRES_USER: loan-engine
      POSTGRES_PASSWORD: password
      POSTGRES_TIMEOUT: 10s
    networks:
      loan-network:
        ipv4_address: 172.20.0.3
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

networks:
  loan-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  postgres_data: